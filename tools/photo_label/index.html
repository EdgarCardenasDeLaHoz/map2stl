<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photo labeller</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root { --bg:#f5f5f7; --fg:#1c1c1e; --card:#fff; --line:#d1d1d6; --accent:#0a84ff; --mut:#6e6e73; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --fg:#f2f2f7; --card:#2c2c2e; --line:#48484a; --mut:#98989d; } }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px system-ui, sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; }
  #bar { display:flex; gap:8px; align-items:center; padding:6px 10px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  #bar select, #bar button { font:inherit; padding:4px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  #bar button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  #bar button:disabled { opacity:.45; }
  #status { color:var(--mut); margin-left:auto; }
  #main { flex:1; display:flex; min-height:0; }
  #photoCol { flex:55; min-width:0; display:flex; flex-direction:column; }
  #dTabs { display:flex; gap:2px; padding:3px 6px; background:var(--card); border-bottom:1px solid var(--line); }
  #dTabs button { font:inherit; padding:2px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  #dTabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #photoWrap { flex:1; position:relative; min-width:0; background:#111; }
  #dLeg { position:absolute; left:8px; bottom:8px; display:none; color:#fff; font-size:11px; text-shadow:0 0 3px #000; pointer-events:none; }
  #dLeg canvas { display:block; width:160px; height:10px; border:1px solid #fff8; }
  #dLeg div { display:flex; justify-content:space-between; width:160px; }
  #dCorner { position:absolute; right:8px; top:8px; display:none; color:#fff; font-size:12px; background:#000a; padding:2px 8px; border-radius:6px; pointer-events:none; }
  #oCtl { position:absolute; left:8px; top:8px; display:none; gap:8px; flex-wrap:wrap; }
  .seg { display:inline-flex; border:1px solid #fff6; border-radius:8px; overflow:hidden; background:#000a; }
  .seg button { font:inherit; font-size:12px; padding:2px 10px; border:0; background:transparent; color:#fff; cursor:pointer; }
  .seg button.on { background:var(--accent); }
  #oLeg { position:absolute; left:8px; bottom:8px; display:none; color:#fff; font-size:11px; background:#000a; padding:4px 8px; border-radius:6px; pointer-events:none; }
  #oLeg .sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin:0 4px 0 8px; vertical-align:-1px; border:1px solid #fff6; }
  #oLeg .sw:first-child { margin-left:0; }
  #oLeg .ring { position:relative; width:52px; height:52px; margin:8px 12px; }
  #oLeg .ring i { position:absolute; inset:0; border-radius:50%; background:conic-gradient(hsl(0 85% 55%),hsl(90 85% 55%),hsl(180 85% 55%),hsl(270 85% 55%),hsl(360 85% 55%)); -webkit-mask:radial-gradient(circle,transparent 14px,#000 15px); mask:radial-gradient(circle,transparent 14px,#000 15px); }
  #oLeg .ring b { position:absolute; font-weight:600; }
  #dCompute { position:absolute; left:50%; top:55%; transform:translateX(-50%); display:none; font:inherit; padding:4px 14px; }
  #photo { width:100%; height:100%; display:block; cursor:crosshair; }
  #mapWrap { flex:45; min-width:0; position:relative; }
  #map, #cesium { position:absolute; inset:0; }
  #cesium { background:#000; }
  .hid { visibility:hidden; pointer-events:none; }
  .num { width:64px; }
  #bar .only3d { display:none; }
  body.mode3d #bar .only3d { display:inline-flex; gap:4px; align-items:center; }
  #cesium .cesium-viewer-bottom { z-index:5; }
  #result { padding:4px 10px; background:var(--card); border-top:1px solid var(--line); min-height:24px; font-variant-numeric:tabular-nums; }
  #pairs { max-height:24vh; overflow:auto; background:var(--card); border-top:1px solid var(--line); }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:2px 8px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
  tr.sel { background:rgba(10,132,255,.15); }
  td input { font:inherit; width:160px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; }
  .dot { display:inline-block; width:14px; height:14px; border-radius:50%; vertical-align:middle; }
  .pin { width:22px; height:22px; border-radius:50%; color:#fff; font:bold 12px/22px system-ui; text-align:center; border:2px solid #fff; box-shadow:0 0 3px #000; }
  .pin.pend { outline:2px dashed #fff; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <select id="region" title="Region: photos, footprints, DEM and model all follow it"></select>
    <select id="photoSel" title="Photo"></select>
    <button id="flagBtn" title="Mark this photo as unusable (wrong place, no buildings, blurred). It leaves the list; Undo brings it back">Flag bad</button>
    <button id="solveBtn" class="primary" disabled>Solve</button>
    <button id="autoBtn" title="Match the photo against renders of the Google 3D mesh and solve the camera (needs 3D tiles)">Auto register</button>
    <button id="saveBtn">Save</button>
    <button id="baseBtn">Map: satellite</button>
    <button id="fitBtn">Fit photo</button>
    <label title="Outline the OSM buildings in view, projected with the solved camera"><input id="bldChk" type="checkbox" checked> Buildings</label>
    <label title="On the map: camera field of view, a sight ray to each pair (cyan for auto pairs) and the buildings outlined on the photo"><input id="rayChk" type="checkbox" checked> Map lines</label>
    <label title="On the map: our best guesses of where the photo was taken and what it looks at (numbered, with the view as a wedge). Click one to use it; drag the large one to search from a new spot"><input id="guessChk" type="checkbox" checked> Guesses</label>
    <label title="List flagged photos too (marked ⚑); Flag bad becomes Unflag for them"><input id="flagChk" type="checkbox"> Show flagged</label>
    <button id="modeBtn"title="Switch the map pane between the 2D map and Google Photorealistic 3D Tiles">Map: 2D</button>
    <span class="only3d">
      <button id="camViewBtn" disabled title="Fly the 3D camera to the solved photo position">View from camera</button>
      <label title="Camera height above the surface under it, metres">+<input id="camUp" class="num" type="number" value="15" step="5"> m</label>
      <label title="Camera pitch, degrees (negative looks down)">pitch <input id="camPitch" class="num" type="number" value="0" step="1"></label>
    </span>
    <span class="only3d" title="Our city model (buildings on terrain, as the export builds them) at its true place and scale over the Google mesh">
      <button id="mdlBtn" title="Load our city model for this region (built on the server the first time, about 2 minutes)">Model</button>
      <select id="mdlShow" title="What to show" disabled>
        <option value="both">Both</option><option value="model">Model</option><option value="google">Google</option>
      </select>
      <input id="mdlAlpha" type="range" min="0" max="1" step="0.05" value="0.6" title="Model opacity" disabled>
      <label title="Height nudge added to the measured geoid offset, metres">dz <input id="mdlDz" class="num" type="number" value="0" step="1" disabled> m</label>
      <button id="mdlGeoid" disabled title="Measure the geoid offset again: low percentile of (Google mesh height - DEM height) at ground points in the model box, in the browser only">geoid ?</button>
    </span>
    <span id="status">Click the photo, then the map (or the reverse). Esc cancels, Delete removes the selected pair.</span>
  </div>
  <div id="main">
    <div id="photoCol">
      <div id="dTabs"><button data-t="photo">Photo</button><button data-t="pd">Photo depth</button><button data-t="gd">Google depth</button><button data-t="df">Difference</button><button data-t="or">Orientation</button></div>
      <div id="photoWrap"><canvas id="photo"></canvas>
        <div id="dLeg"><canvas width="160" height="10"></canvas><div><span></span><span></span><span></span></div></div>
        <div id="oCtl"><div class="seg" id="oSrc"><button data-v="photo">Photo</button><button data-v="google">Google</button></div><div class="seg" id="oView"><button data-v="surf">Surfaces</button><button data-v="wall">Wall facing</button><button data-v="pitch">Roof pitch</button></div></div>
        <div id="oLeg"></div>
        <div id="dCorner"></div><button id="dCompute">Compute depth</button></div>
    </div>
    <div id="mapWrap"><div id="map"></div><div id="cesium" class="hid"></div></div>
  </div>
  <div id="result"></div>
  <div id="pairs"><table><thead><tr><th>#</th><th>Label</th><th>x, y (px)</th><th>lat, lon, height</th><th>Residual</th><th>Height</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
const COLORS = ["#e6194b","#3cb44b","#ffb400","#4363d8","#f58231","#911eb4","#00b7c3","#f032e6","#9a6324","#800000","#808000","#000075"];
const $ = id => document.getElementById(id);
const st = { auto: [], photos: [], photo: null, img: null, pairs: [], pending: null, sel: null, nextN: 1,
             solve: null, bld: [], hoverId: null, hiId: null, view: { s: 1, ox: 0, oy: 0 }, mapMarkers: new Map(), footprints: null };
// ---------- depth view state (tabs: photo | pd photo depth | gd Google depth | df difference) ----------
const GD_GRID_W = 200, D_NEAR = 30, D_FAR = 3000, D_DIFF = 0.5;
const dv = { tab: "photo", seq: 0, ver: 0, p: null, gc: new Map(), loading: false, gbusy: false, gerr: null, timer: 0, layer: null, chrome: "", src: "photo", view: "surf" };
const DV_TABS = ["photo", "pd", "gd", "df", "or"];
try {
  const t = localStorage.getItem("photoLabelTab"); if (DV_TABS.includes(t)) dv.tab = t;
  const s = localStorage.getItem("photoLabelOrSrc"); if (s === "photo" || s === "google") dv.src = s;
  const v = localStorage.getItem("photoLabelOrView"); if (["surf", "wall", "pitch"].includes(v)) dv.view = v;
} catch (_) { /* storage can be blocked */ }
function turbo(t) {          // polynomial fit of the turbo map, t in 0..1 -> [r,g,b] 0..255
  const c = x => Math.round(255 * Math.min(1, Math.max(0, x)));
  return [c(0.13572138 + t * (4.61539260 + t * (-42.66032258 + t * (132.13108234 + t * (-152.94239396 + t * 59.28637943))))),
          c(0.09140261 + t * (2.19418839 + t * (4.84296658 + t * (-14.18503333 + t * (4.27729857 + t * 2.82956604))))),
          c(0.10667330 + t * (12.64194608 + t * (-60.58204836 + t * (110.36276771 + t * (-89.90310912 + t * 27.34824973)))))];
}
const TURBO = Array.from({ length: 256 }, (_, i) => turbo(i / 255));
// metres -> colour: log distance D_NEAR..D_FAR, near = warm
const distT = m => 1 - Math.min(1, Math.max(0, Math.log(m / D_NEAR) / Math.log(D_FAR / D_NEAR)));
const distRgb = m => TURBO[Math.round(distT(m) * 255)];
function divRgb(d) {         // relative difference, clamped to +-D_DIFF: blue (photo nearer) - white - red (photo farther)
  const t = Math.min(1, Math.max(-1, d / D_DIFF)), a = Math.abs(t), end = t < 0 ? [33, 102, 172] : [178, 24, 43];
  return end.map(e => Math.round(255 + (e - 255) * a));
}
const colorOf = n => COLORS[(n - 1) % COLORS.length];
const status = t => { $("status").textContent = t; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- map ----------
// Which region the page shows; every fetch carries it (the Google tile proxy does not need it).
let curRegion = "", regionSeq = 0;
const api = p => p + (p.includes("?") ? "&" : "?") + "region=" + encodeURIComponent(curRegion);
// The view comes from the region (/api/config), so the map has none until a region is loaded.
const map = L.map("map", { zoomControl: true });
const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  { attribution: "Esri", maxZoom: 19 }).addTo(map);
const osmTiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "&copy; OpenStreetMap", maxZoom: 19 });
let satOn = true;
$("baseBtn").onclick = () => {
  satOn = !satOn;
  if (satOn) { map.removeLayer(osmTiles); sat.addTo(map); } else { map.removeLayer(sat); osmTiles.addTo(map); }
  $("baseBtn").textContent = "Map: " + (satOn ? "satellite" : "OSM");
};
const camLayer = L.layerGroup().addTo(map);
const fpLayers = new Map();            // footprint id -> Leaflet layer
let fpHi = null;                       // footprint id highlighted on the map
const fpStyle = f => f.properties.name
  ? { color: "#ffd60a", weight: 2, fillOpacity: .15 } : { color: "#fff", weight: 0.8, fillOpacity: 0.03 };
const rayLayer = L.layerGroup().addTo(map);  // "Map lines": fov wedge and sight rays
let fpInView = new Set();              // footprint ids recoloured to match the photo's outlines
const fpBase = f => fpInView.has(f.properties.id)
  ? { color: `hsl(${hue(f.properties.id)},85%,55%)`, weight: 2, fillOpacity: .25 } : fpStyle(f);
// Map counterpart of the photo overlay, drawn from the solved camera; the checkbox hides all of it.
function drawMapLines() {
  rayLayer.clearLayers();
  const old = fpInView; fpInView = new Set();
  for (const id of old) { const l = fpLayers.get(id); if (l && id !== fpHi) l.setStyle(fpStyle(l.feature)); }
  const q = camPose;
  if (!q || !$("rayChk").checked) return;
  const pt = b => { const d = 1500, kx = 111320 * Math.cos(q.lat * Math.PI / 180), a = b * Math.PI / 180;
    return [q.lat + d * Math.cos(a) / 111320, q.lon + d * Math.sin(a) / kx]; };
  const h = q.heading_deg, hf = q.hfov_deg / 2;
  L.polygon([[q.lat, q.lon], pt(h - hf), pt(h), pt(h + hf)], { color: "#0a84ff", weight: 1, fillOpacity: .15, interactive: false }).addTo(rayLayer);
  for (const p of st.auto)
    L.polyline([[q.lat, q.lon], [p.lat, p.lon]], { color: "#00e5ff", weight: 1, opacity: .6, interactive: false }).addTo(rayLayer);
  for (const p of st.pairs) if (p.lat != null)
    L.polyline([[q.lat, q.lon], [p.lat, p.lon]], { color: colorOf(p.n), weight: 2, interactive: false }).addTo(rayLayer);
  for (const b of st.bld) {
    const l = fpLayers.get(b.id); if (!l) continue;
    fpInView.add(b.id); if (b.id !== fpHi) l.setStyle(fpBase(l.feature));
  }
}
function mapHighlight(id) {
  if (fpHi != null && fpLayers.has(fpHi)) fpLayers.get(fpHi).setStyle(fpBase(fpLayers.get(fpHi).feature));
  fpHi = id;
  const l = id == null ? null : fpLayers.get(id);
  if (l) { l.setStyle({ color: "#ff453a", weight: 3, fillOpacity: .35 }); l.bringToFront(); }
}

let fpGroup = null;                     // the footprints near the view, on the map
let fpAll = [];                         // every footprint layer, with its bounds: [layer, bounds]
// One canvas for every footprint: as SVG each of a region's 40k buildings is a DOM node.
const fpRenderer = L.canvas({ padding: 0.2, tolerance: 3 });
async function loadFootprints(seq) {
  const fc = await fetch(api("/api/footprints")).then(r => r.json());
  if (seq !== regionSeq) return;
  st.footprints = fc;
  const g = L.geoJSON(fc, {
    style: fpStyle,
    onEachFeature: (f, layer) => {
      fpLayers.set(f.properties.id, layer);
      if (f.properties.name) layer.bindTooltip(f.properties.name, { sticky: true });
      layer.on("click", () => { if (st.bld.length) { st.hiId = f.properties.id; draw(); } });
    },
    interactive: true,
    renderer: fpRenderer,
  });
  fpAll = g.getLayers().map(l => [l, l.getBounds()]);
  fpGroup = L.layerGroup().addTo(map);
  fpBounds = fc.features.length ? g.getBounds() : null;
  homeMap();
  fpWindow();
  status(fc.features.length + " footprints loaded.");
}
// Leaflet re-projects every layer on the map at each zoom, so only the footprints within a third
// a screen of the view are on it (Cartagena: 41k outlines made each zoom take ~0.5 s against
// ~30 ms without them). Below FP_MIN_ZOOM none are, unless the region is small.
const FP_MIN_ZOOM = 15;
function fpWindow() {
  if (!fpGroup) return;
  const all = fpAll.length < 3000, on = all || map.getZoom() >= FP_MIN_ZOOM;
  const box = map.getBounds().pad(0.3);
  for (const [l, b] of fpAll) {
    const want = on && (all || box.intersects(b)), has = fpGroup.hasLayer(l);
    if (want && !has) fpGroup.addLayer(l); else if (!want && has) fpGroup.removeLayer(l);
  }
}
map.on("moveend", fpWindow);
// The 2D map's home: the region's start view, else the footprints' extent.
function homeMap() {
  if (startView) map.setView([startView.lat, startView.lon], 15);
  else if (fpBounds) map.fitBounds(fpBounds);
}

function nameAt(lat, lon) {
  if (!st.footprints) return null;
  for (const f of st.footprints.features) {
    const nm = f.properties.name; if (!nm) continue;
    const ring = f.geometry.coordinates[0]; let c = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [xi, yi] = ring[i], [xj, yj] = ring[j];
      if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) c = !c;
    }
    if (c) return nm;
  }
  return null;
}

function pinIcon(n, pend) {
  return L.divIcon({ className: "", iconSize: [22, 22], iconAnchor: [11, 11],
    html: `<div class="pin${pend ? " pend" : ""}" style="background:${colorOf(n)}">${n}</div>` });
}
function setMapMarker(p) {
  const old = st.mapMarkers.get(p.n); if (old) map.removeLayer(old);
  setCesMarker(p);
  if (p.lat == null) return;
  const m = L.marker([p.lat, p.lon], { icon: pinIcon(p.n, p === st.pending), draggable: true }).addTo(map);
  // A dragged 2D marker no longer sits at the 3D pick, so its height is dropped.
  m.on("dragend", () => { const ll = m.getLatLng(); p.lat = ll.lat; p.lon = ll.lng; p.h = null; p.hGround = null; setCesMarker(p); invalidate(); renderRows(); });
  m.on("click", () => select(p.n));
  st.mapMarkers.set(p.n, m);
}
function dropMarker(n) {
  const m = st.mapMarkers.get(n); if (m) { map.removeLayer(m); st.mapMarkers.delete(n); }
  dropCesMarker(n);
}
// A click on the 2D map (h = null) or on the 3D surface (h = ellipsoidal height, m).
function mapClick(ll, h = null) {
  if (!st.img) return;
  let p = st.pending;
  if (p && p.lat == null) {
    p.lat = ll.lat; p.lon = ll.lng; p.h = h; p.hGround = null; finish(p);
  } else if (!p) {
    p = { n: st.nextN++, label: "", x: null, y: null, lat: ll.lat, lon: ll.lng, h };
    st.pending = p; setMapMarker(p); status("Now click the matching point on the photo.");
  }
  draw();
}
map.on("click", e => mapClick(e.latlng));

function finish(p) {
  st.pending = null;
  if (!p.label) p.label = nameAt(p.lat, p.lon) || ("P" + p.n);
  st.pairs.push(p); st.sel = p.n; setMapMarker(p); invalidate(); renderRows(); draw();
  status("Pair " + p.n + " added.");
}

// ---------- 3D view (Cesium + Google Photorealistic 3D Tiles through the /tiles3d proxy) ----------

// <pinhole-math>
// Camera maths shared by the page and tests/test_photo_label_register.py (run under node).
// pinholeProject == city2stl.skyline.photo_view.PinholeCamera.project_ll; cesiumView/cesiumBasis map
// a PinholeCamera onto Cesium's heading/pitch/roll/fov and back, so a render matches the photo's pixels.
const M_PER_DEG_LAT = 111320;
function pinholeAxes(c) {                 // [right, up, fwd] in east, north, up
  const h = c.heading_deg * Math.PI / 180, p = c.pitch_deg * Math.PI / 180, r = (c.roll_deg || 0) * Math.PI / 180;
  const fwd = [Math.sin(h) * Math.cos(p), Math.cos(h) * Math.cos(p), Math.sin(p)];
  const r0 = [Math.cos(h), -Math.sin(h), 0];
  const u0 = [r0[1] * fwd[2] - r0[2] * fwd[1], r0[2] * fwd[0] - r0[0] * fwd[2], r0[0] * fwd[1] - r0[1] * fwd[0]];
  const right = r0.map((v, i) => Math.cos(r) * v + Math.sin(r) * u0[i]);
  const up = r0.map((v, i) => -Math.sin(r) * v + Math.cos(r) * u0[i]);
  return [right, up, fwd];
}
function pinholeProject(c, lat, lon, h) {
  const kx = M_PER_DEG_LAT * Math.cos(c.lat * Math.PI / 180);
  const d = [(lon - c.lon) * kx, (lat - c.lat) * M_PER_DEG_LAT, h - c.elev_m];
  const [right, up, fwd] = pinholeAxes(c), dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const z = dot(d, fwd);
  if (z <= 1e-9) return { x: NaN, y: NaN, z };
  return { x: c.width / 2 + c.f_px * dot(d, right) / z, y: c.height / 2 - c.f_px * dot(d, up) / z, z };
}
// Cesium orientation of a pinhole camera drawn at rw x rh pixels (rw/cam.width scales f).
// Cesium roll is the opposite sign of the pinhole roll; frustum.fov is the horizontal angle when aspect >= 1.
function cesiumView(c, rw, rh) {
  const f = c.f_px * rw / c.width, fovy = 2 * Math.atan(rh / 2 / f), hfov = 2 * Math.atan(rw / 2 / f);
  return { heading: c.heading_deg * Math.PI / 180, pitch: c.pitch_deg * Math.PI / 180, roll: -(c.roll_deg || 0) * Math.PI / 180,
           fovy, hfov, fov: rw / rh >= 1 ? hfov : fovy, aspect: rw / rh };
}
// Cesium's camera basis in east, north, up for a heading/pitch/roll (Camera.setView3D): the orientation
// quaternion is Rz(-(heading - 90 deg)) Ry(-pitch) Rx(roll); direction is its first column, up its third.
function cesiumBasis(heading, pitch, roll) {
  const mul = (a, b) => a.map((_, i) => [0, 1, 2].map(j => a[i][0] * b[0][j] + a[i][1] * b[1][j] + a[i][2] * b[2][j]));

  const ag = R.agree != null ? ` · agree ${Math.round(R.agree <= 1 ? R.agree * 100 : R.agree)}%` : "";
  const nm = n => n === "photo" ? "Photo" : "Google";
  L.corner = (sel.name === dv.src ? nm(sel.name) + " depth" : `${nm(sel.name)} depth (${nm(dv.src)} unavailable)`) + ag;
}
async function dvOrient() {
  if (dv.tab !== "or" || !st.photo) return;
  const g = curG(); if (!g || !orReady(g) || dvNeedCam()) return;
  const key = orKey(g); if (g.orient && g.orient.key === key) return;
  const o = g.orient = { key, state: "busy" }, seq = dv.seq, ph = st.photo, f = g.fit && !g.fit.fail ? g.fit : null;
  status("Orientation: computing...");
  const body = { photo: ph.path, camera: { ...camPose, width: ph.w, height: ph.h }, depth: g.b64, depth_w: g.w, depth_h: g.h, grid_w: 320,
    buildings: st.bld.map(b => ({ id: b.id, rings: b.contours, dist: b.dist_m })) };
  if (f) { body.a = f.a; body.b = f.b; }
  try {
    const r = await postJson("/api/depth/orient", body);
    if (r.ok) { o.state = "ok"; o.r = r; status("Orientation ready."); }
    else { o.state = "err"; o.error = r.reason || r.error || "failed"; status("Orientation failed: " + o.error); }
  } catch (e) { o.state = "err"; o.error = e.message || String(e); status("Orientation failed: " + o.error); }
  if (seq !== dv.seq) { if (g.orient === o) delete g.orient; return; }
  dv.layer = null; dv.ver++; draw();
}
function orMarks() {
  document.querySelectorAll("#oSrc button").forEach(b => b.classList.toggle("on", b.dataset.v === dv.src));
  document.querySelectorAll("#oView button").forEach(b => b.classList.toggle("on", b.dataset.v === dv.view));
}
function orSet(key, val) {
  dv[key] = val; dv.layer = null; dv.chrome = "";
  try { localStorage.setItem(key === "src" ? "photoLabelOrSrc" : "photoLabelOrView", val); } catch (_) { /* storage can be blocked */ }
  orMarks(); draw();
}
$("oSrc").onclick = e => { if (e.target.dataset.v) orSet("src", e.target.dataset.v); };
$("oView").onclick = e => { if (e.target.dataset.v) orSet("view", e.target.dataset.v); };
orMarks();
function orHover(e) {
  if (drag || !st.img) return;
  const r = cv.getBoundingClientRect(), [x, y] = toImg(e.clientX - r.left, e.clientY - r.top);
  if (x < 0 || y < 0 || x >= st.img.width || y >= st.img.height) return;
  const g = curG(), o = g && g.orient; if (!o || o.state !== "ok") return;
  const sel = orSource(o.r); if (!sel) return;
  const s = sel.s, d = orDecode(s), i = Math.min(s.h - 1, Math.floor(y / st.img.height * s.h)) * s.w + Math.min(s.w - 1, Math.floor(x / st.img.width * s.w));
  const c = d.cls[i], pt = d.pitch[i], az = d.az[i];
  let t = OR_CLS[c] || "none";
  if (Number.isFinite(pt)) t += `, pitch ${Math.round(pt)}°`;
  if (Number.isFinite(az)) t += `, facing ${compassTxt(az)}`;
  const b = bldAt(x, y), sm = b && s.buildings && s.buildings[b.id];
  if (sm) {
    const walls = [...new Set((sm.wall_az || []).map(compassWord))].join("/");
    const roof = sm.roof === "pitched" ? `pitched${sm.pitch_deg != null ? " " + Math.round(sm.pitch_deg) + "°" : ""}` : sm.roof;
    t += `; building ${b.id}: ${roof}${walls ? ", walls " + walls : ""} (${sel.name})`;
  }
  status(t);
}

async function loadPhoto(path) {
  st.photo = st.photos.find(p => p.path === path);
  syncFlagBtn();
  for (const n of [...st.mapMarkers.keys(), ...ces.markers.keys()]) dropMarker(n);
  st.pairs = []; st.auto = []; st.pending = null; st.sel = null; st.nextN = 1; st.geoid = null; invalidate(); dvReset(); clearGuesses();
  const seq = regionSeq, ph = st.photo;
  const img = new Image();
  await new Promise((ok, bad) => { img.onload = ok; img.onerror = bad; img.src = api("/photo/" + path.split("/").map(encodeURIComponent).join("/")); });
  const doc = await fetch(api("/api/labels?photo=" + encodeURIComponent(path))).then(r => r.json());
  if (seq !== regionSeq || st.photo !== ph) return;       // switched region or photo while loading
  st.img = img;
  for (const l of doc.labels || []) {
    if (l.lat == null || l.x == null) continue;
    if (l.auto) { st.auto.push({ n: "auto" + (st.auto.length + 1), label: l.label, x: l.x, y: l.y, lat: l.lat, lon: l.lon, h: l.h_ellipsoid_m ?? null }); continue; }
    const p = { n: st.nextN++, label: l.label, x: l.x, y: l.y, lat: l.lat, lon: l.lon, h: l.h_ellipsoid_m ?? null };
    st.pairs.push(p); setMapMarker(p);
  }
  invalidate();
  const q = doc.camera;                    // a saved camera: buildings reappear without solving again
  if (q && q.lat != null) {
    st.solve = { pose: q, ticks: [], predicted_x: [], residuals_px: [], restored: true, source: doc.camera_source || "solve" };
    camPose = q; $("camViewBtn").disabled = false; showCam(q);
    if (!ces.on) map.setView([q.lat, q.lon], 16); else centre3d(true);
    loadBuildings();
  }
  renderRows(); resize(); fit(); dvRefresh();
  status(`${st.pairs.length} saved pairs loaded` + (st.auto.length ? `, ${st.auto.length} auto pairs` : "") + (q ? ", saved camera restored." : "."));
  if (!(q && q.lat != null)) loadGuesses();
}
$("photoSel").onchange = e => loadPhoto(e.target.value);
// Flag the current photo as bad: the server keeps the flag and leaves it out of /api/photos;
// here it leaves the list and the next photo opens. The status line offers Undo.
async function flagPhoto(path, bad) {
  let r = null;
  try { r = await postJson("/api/photo/flag", { photo: path, bad }); } catch (_) {}
  if (!r || !r.ok) { status("Could not flag: " + ((r && (r.reason || r.error)) || "server error")); return false; }
  return true;
}
// "Show flagged" lists flagged photos too (marked, flagBtn turns into Unflag) instead of hiding them.
const showFlagged = () => $("flagChk").checked;
const photoOpt = p => `<option value="${esc(p.path)}">${p.bad ? "⚑ flagged · " : ""}${esc(p.path)} (${p.w}x${p.h})</option>`;
function fillPhotoSel() {
  // seed frames (seeds/seed_N/...) get one optgroup per seed folder; other photos stay flat
  const html = [], grp = p => p.path.startsWith("seeds/") ? p.path.slice(0, p.path.lastIndexOf("/")) : "";
  let cur = "";
  for (const p of st.photos) {
    const g = grp(p);
    if (g !== cur) { if (cur) html.push("</optgroup>"); if (g) html.push(`<optgroup label="${esc(g)}">`); cur = g; }
    html.push(photoOpt(p));
  }
  if (cur) html.push("</optgroup>");
  $("photoSel").innerHTML = html.join("");
  if (st.photo && st.photos.includes(st.photo)) $("photoSel").value = st.photo.path;
}
function syncFlagBtn() {
  const bad = !!(st.photo && st.photo.bad);
  $("flagBtn").textContent = bad ? "Unflag" : "Flag bad";
}
async function loadPhotoList(seq) {
  const list = await fetch(api("/api/photos" + (showFlagged() ? "?all=1" : ""))).then(r => r.json());
  if (seq !== regionSeq) return null;
  st.photos = list;
  return list;
}
try { if (localStorage.getItem("photoLabelFlagged") === "1") $("flagChk").checked = true; } catch (_) { /* storage can be blocked */ }
$("flagChk").onchange = async () => {
  try { localStorage.setItem("photoLabelFlagged", showFlagged() ? "1" : "0"); } catch (_) {}
  const cur = st.photo && st.photo.path, list = await loadPhotoList(regionSeq);
  if (!list) return;
  st.photo = list.find(p => p.path === cur) || null;
  fillPhotoSel();
  if (!st.photo && list.length) { $("photoSel").value = list[0].path; loadPhoto(list[0].path); } else syncFlagBtn();
};
$("flagBtn").onclick = async () => {
  if (!st.photo) return;
  const item = st.photos.find(p => p.path === st.photo.path), at = st.photos.indexOf(item);
  if (item && showFlagged()) {                      // flagged photos stay listed: just toggle the mark
    if (!(await flagPhoto(item.path, !item.bad))) return;
    if (item.bad) delete item.bad; else item.bad = true;
    fillPhotoSel(); syncFlagBtn();
    status((item.bad ? "Flagged " : "Unflagged ") + item.path + ".");
    return;
  }
  if (!item || !(await flagPhoto(item.path, true))) return;
  st.photos.splice(at, 1);
  $("photoSel").querySelector(`option[value="${CSS.escape(item.path)}"]`)?.remove();
  const next = st.photos[Math.min(at, st.photos.length - 1)];
  if (next) { $("photoSel").value = next.path; await loadPhoto(next.path); } else status("No photos left.");
  $("status").innerHTML = "";
  $("status").append("Flagged " + item.path + " as bad. ");
  const undo = document.createElement("a"); undo.href = "#"; undo.textContent = "Undo";
  undo.onclick = async e => {
    e.preventDefault();
    if (!(await flagPhoto(item.path, false))) return;
    st.photos.splice(at, 0, item);
    const o = new Option(`${item.path} (${item.w}x${item.h})`, item.path);
    const ref = $("photoSel").options[at];
    (ref ? ref.parentNode : $("photoSel")).insertBefore(o, ref || null);
    $("photoSel").value = item.path; loadPhoto(item.path);
  };
  $("status").append(undo);
};

// ---------- regions ----------
// Everything region-specific is dropped and reloaded: photos, footprints, view, the open photo and its
// pairs, any loaded model. regionSeq lets a slow response from the region left behind be ignored.
function clearRegion() {
  for (const n of [...st.mapMarkers.keys(), ...ces.markers.keys()]) dropMarker(n);
  st.pairs = []; st.auto = []; st.pending = null; st.sel = null; st.nextN = 1;
  st.photo = null; st.img = null; st.photos = []; st.footprints = null; st.view = { s: 1, ox: 0, oy: 0 };
  clearGuesses(); invalidate(); renderRows(); draw(); dvReset(true);
  $("photoSel").innerHTML = "";
  if (fpGroup) { map.removeLayer(fpGroup); fpGroup = null; }
  fpAll = [];
  fpLayers.clear(); fpHi = null; fpBounds = null;
  disposeModel(); disposeRenderViewer();    // its cached tiles belong to the region left behind
  ces.centredFor = null;
}
async function switchRegion(id) {
  const seq = ++regionSeq;
  curRegion = id;
  history.replaceState(null, "", "#region=" + encodeURIComponent(id));
  try { localStorage.setItem("photoLabelRegion", id); } catch (_) { /* storage can be blocked */ }
  if ($("region").value !== id) $("region").value = id;
  clearRegion();
  status("Loading " + id + "...");
  await loadConfig(seq);
  if (seq !== regionSeq) return;
  homeMap();
  if (ces.on) centre3d(true);
  loadFootprints(seq);
  const list = await loadPhotoList(seq);
  if (!list) return;
  fillPhotoSel();
  if (list.length) loadPhoto(list[0].path); else status("No photos in " + id + ".");
  screenPhotos(seq);
}
// Auto screening: the server flags street-level frames and stitched panoramas in the background;
// poll every 10 s, then drop what it flagged from the list (Undo unflags them all).
async function screenPhotos(seq) {
  try { await postJson("/api/photos/screen", {}); } catch (_) { return; }
  let r = null;
  for (;;) {
    await new Promise(ok => setTimeout(ok, 10000));
    if (seq !== regionSeq) return;
    try { r = await fetch(api("/api/photos/screen")).then(x => x.json()); } catch (_) { continue; }
    if (r.state !== "running") break;
  }
  const gone = st.photos.filter(p => r.flagged.includes(p.path) && !p.bad);
  if (!gone.length) return;
  if (showFlagged()) {                               // keep them listed, marked
    for (const p of gone) p.bad = true;
    fillPhotoSel(); syncFlagBtn();
    status(`Auto-flagged ${gone.length} photos (street level / panorama); they stay listed while "Show flagged" is on.`);
    return;
  }
  const was = st.photos.map(p => p.path), cur = st.photo && st.photo.path;
  st.photos = st.photos.filter(p => !r.flagged.includes(p.path));
  for (const p of gone) $("photoSel").querySelector(`option[value="${CSS.escape(p.path)}"]`)?.remove();
  if (cur && r.flagged.includes(cur)) {            // the open photo went: open the next one, as flagBtn does
    const next = st.photos.find(p => was.indexOf(p.path) > was.indexOf(cur)) || st.photos[st.photos.length - 1];
    if (next) { $("photoSel").value = next.path; await loadPhoto(next.path); } else status("No photos left.");
  }
  $("status").innerHTML = "";
  $("status").append(`Auto-flagged ${gone.length} photos (street level / panorama). `);
  const undo = document.createElement("a"); undo.href = "#"; undo.textContent = "Undo";
  undo.onclick = async e => {
    e.preventDefault();
    if (seq !== regionSeq) return;
    for (const p of gone) if (!(await flagPhoto(p.path, false))) return;
    st.photos = st.photos.concat(gone).sort((a, b) => was.indexOf(a.path) - was.indexOf(b.path));
    fillPhotoSel();
    status(`Restored ${gone.length} photos.`);
  };
  $("status").append(undo);
}
$("region").onchange = e => switchRegion(e.target.value);
(async function startRegions() {
  let info;
  try { info = await fetch("/api/regions").then(r => r.json()); } catch (_) { status("Cannot reach the server."); return; }
  $("region").innerHTML = info.regions.map(r => `<option value="${esc(r.id)}">${esc(r.label)} (${r.photos})</option>`).join("");
  let want = decodeURIComponent((location.hash.match(/region=([^&]*)/) || [])[1] || "");
  if (!want) { try { want = localStorage.getItem("photoLabelRegion") || ""; } catch (_) { /* ignore */ } }
  switchRegion(info.regions.some(r => r.id === want) ? want : info.default);
})();
resize();
</script>
