<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photo labels</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div id="app">
  <header id="hdr">
    <h1>Photo labels</h1>
    <div id="ctx">
      <button id="ctxBtn" class="pill" aria-haspopup="true" aria-expanded="false" title="Choose the region and the photo"></button>
      <div id="ctxPop" hidden>
        <label>Region <select id="region" title="Region: photos, footprints, DEM and model all follow it"></select></label>
        <label>Photo <select id="photoSel" title="Photo"></select></label>
      </div>
    </div>
    <span class="sp"></span>
    <button id="autoBtn" class="magic" title="Match the photo against renders of the Google 3D mesh and solve the camera (needs 3D tiles)">✨ Auto register</button>
    <span id="saved" class="saved ok" title="Every change to the pairs is saved automatically">✓ Saved</span>
    <button id="gearBtn" class="gear" title="Settings" aria-label="Settings">⚙</button>
  </header>
  <div id="main">
    <section id="photoCol" class="card">
      <div class="ch">
        <span class="cap">Photo</span><span class="note" id="photoDims"></span>
        <div id="dTabs"><button data-t="photo" title="The photo">Photo</button><button data-t="pd" title="Depth estimated from the photo">Photo depth</button><button data-t="gd" title="Depth rendered from Google 3D at the solved camera">Google depth</button><button data-t="df" title="Where the two depths disagree">Difference</button><button data-t="or" data-need="orient" title="Surfaces, walls and roofs">Orientation</button></div>
        <span class="sp"></span>
        <button id="flagBtn" class="ghost" title="Mark this photo as unusable (wrong place, no buildings, blurred). It leaves the list; Undo brings it back">⚑ Flag bad</button>
      </div>
      <div id="photoWrap"><canvas id="photo"></canvas>
        <div id="ptl"><div id="oCtl"><div class="seg" id="oSrc"><button data-v="photo">Photo</button><button data-v="google">Google</button></div><div class="seg" id="oView"><button data-v="surf">Surfaces</button><button data-v="wall">Wall facing</button><button data-v="pitch">Roof pitch</button></div></div>
          <label id="flagShow" class="chip" data-need="screen" title="List flagged photos too (marked ⚑); Flag bad becomes Unflag for them"><input id="flagChk" type="checkbox"> Show flagged</label></div>
        <div class="zoom" id="photoZoom"><button id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button><button id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button></div>
        <div id="dLeg"><canvas width="160" height="10"></canvas><div><span></span><span></span><span></span></div></div>
        <div id="oLeg"></div>
        <div id="dCorner"></div><button id="dCompute">Compute depth</button><button id="gRender" title="Fetch Google 3D tiles and render the view from the solved camera">Render Google depth</button>
        <span id="status">Click the photo, then the map (or the reverse). Esc cancels, Delete removes the selected pair.</span>
        <button id="fitBtn" class="float" title="Fit the whole photo in the view">⤢ Fit photo</button>
      </div>
    </section>
    <section id="mapWrap" class="card">
      <div class="ch">
        <span class="cap">Map</span><span class="note" id="mapNote"></span><span class="sp"></span>
        <span class="seg" id="modeSeg" data-need="3d model" title="Switch the map pane between the 2D map and Google Photorealistic 3D Tiles"><button id="mode2d" class="on">2D</button><button id="mode3d">3D</button></span>
      </div>
      <div id="mapBody">
        <div id="map"></div><div id="cesium" class="hid"></div>
        <div id="mapTL" class="float">
          <label class="chip" data-need="maps" title="Outline the OSM buildings in view, projected with the solved camera"><input id="bldChk" type="checkbox" checked> Buildings</label>
          <label class="chip" data-need="maps" title="Height of the outlined buildings: the pipeline's published height, or the measured one where the published height was withheld (those show a dashed outline at the measured height)">Heights <select id="hModeSel"><option value="published">published</option><option value="measured">measured</option></select></label>
          <label class="chip" data-need="maps" title="On the map: camera field of view, a sight ray to each pair (cyan for auto pairs) and the buildings outlined on the photo"><input id="rayChk" type="checkbox" checked> Map lines</label>
          <label class="chip" data-need="guesses" title="On the map: our best guesses of where the photo was taken and what it looks at (numbered, with the view as a wedge). Click one to use it; drag the large one to search from a new spot"><input id="guessChk" type="checkbox" checked> Guesses</label>
        </div>
        <div id="mapBL" class="float only3d">
          <span class="grp" data-need="3d" title="Fly the 3D camera to the solved photo position">
            <button id="camViewBtn" class="chip" disabled>View from camera</button>
            <label class="chip" title="Camera height above the surface under it, metres">+<input id="camUp" class="num" type="number" value="15" step="5"> m</label>
            <label class="chip" title="Camera pitch, degrees (negative looks down)">pitch <input id="camPitch" class="num" type="number" value="0" step="1"></label>
          </span>
          <span class="grp" data-need="model" title="Our city model (buildings on terrain, as the export builds them) at its true place and scale over the Google mesh">
            <button id="mdlBtn" class="chip" title="Load our city model for this region (built on the server the first time, about 2 minutes)">Model</button>
            <select id="mdlShow" class="chip" title="What to show" disabled>
              <option value="both">Both</option><option value="model">Model</option><option value="google">Google</option>
            </select>
            <input id="mdlAlpha" type="range" min="0" max="1" step="0.05" value="0.6" title="Model opacity" disabled>
            <label class="chip" title="Height nudge added to the measured geoid offset, metres">dz <input id="mdlDz" class="num" type="number" value="0" step="1" disabled> m</label>
            <button id="mdlGeoid" class="chip" disabled title="Measure the geoid offset again: low percentile of (Google mesh height - DEM height) at ground points in the model box, in the browser only">geoid ?</button>
          </span>
        </div>
        <div id="mapBR" class="float" title="Base map"><span class="seg" id="baseSeg"><button id="baseSat" class="on">Satellite</button><button id="baseOsm">Street</button></span></div>
      </div>
    </section>
  </div>
  <section id="pairsCard" class="card">
    <div class="ch">
      <span class="cap">Pairs</span><span class="note" id="pairCount">0 of 4 needed</span><span class="chip" id="pose" hidden></span>
      <span class="sp"></span><span class="note" id="solveNeed"></span>
      <button id="solveBtn" class="btn" disabled title="Needs 4 pairs · 0 so far">Solve</button>
    </div>
    <div id="result" data-need="solve" title="The full solve result"></div>
    <div id="pairs"><table><thead><tr><th class="c1">#</th><th>Label</th><th class="pd">Photo x, y (px)</th><th class="pd">Map lat, lon, height</th><th class="pd">Height (solved · OSM)</th><th class="cf">Fit</th><th class="c1"></th></tr></thead><tbody id="rows"></tbody></table>
      <div id="pairHint"></div></div>
  </section>
</div>
<div id="scrim" hidden></div>
<aside id="sheet" hidden role="dialog" aria-label="Settings">
  <div class="top"><h2>Settings</h2><button id="sheetClose" class="xbtn" title="Close (Esc)" aria-label="Close settings">✕</button></div>
  <input id="sheetSearch" type="search" placeholder="Search settings" aria-label="Search settings" autocomplete="off">
  <div id="sheetBody"></div>
</aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="static/main.js"></script>
</body>
</html>
