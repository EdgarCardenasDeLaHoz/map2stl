# ruff configuration for strm2stl
# Run: ruff check .      Fix: ruff check --fix .

line-length = 100
target-version = "py311"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear (common bugs)
    "UP",  # pyupgrade (modern Python syntax)
]
ignore = [
    "E501",  # line too long — handled by formatter, not linter
    "B008",  # do not perform function calls in argument defaults (FastAPI uses this)
    "B006",  # mutable default argument (too noisy for this codebase)
    "UP007", # use X | Y for union type hints — keep Optional[] for clarity
]

[lint.per-file-ignores]
"tests/*" = ["F811"]   # redefinition of unused name (fixture overrides are expected)
# Research / operator scripts: correctness rules (F, B0xx bugs) still apply; the
# style-only rules below are not worth churning one-off analysis code for.
"tools/**" = ["E701", "E702", "E731", "E741", "UP031", "B904", "B905"]
"tests/manual/**" = ["E701", "E702", "E731", "E741", "UP031", "B904", "B905"]

[format]
quote-style = "double"
indent-style = "space"
