name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # Windows matches the development machines (paths, h5py/pymeshlab wheels).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: map2stl
      # numpy2stl is a sibling repo; pytest.ini also runs its tests.
      - uses: actions/checkout@v7
        with:
          repository: EdgarCardenasDeLaHoz/numpy2stl
          path: numpy2stl
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: map2stl/requirements*.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r map2stl/requirements.txt -r map2stl/requirements-dev.txt
          pip install --no-deps -e numpy2stl -e map2stl
      - name: Lint
        working-directory: map2stl
        run: ruff check .
      - name: Test
        working-directory: map2stl
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -p no:cacheprovider --junitxml=pytest-report.xml

      - name: Annotate test failures
        if: failure()
        shell: python
        run: |
          import pathlib, xml.etree.ElementTree as ET
          for p in pathlib.Path(".").rglob("pytest-report.xml"):
              for case in ET.parse(p).iter("testcase"):
                  for bad in list(case.iter("failure")) + list(case.iter("error")):
                      msg = " ".join((bad.get("message") or "").split())[:900]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{msg}")

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: map2stl
    steps:
      - uses: actions/checkout@v7
        with:
          path: map2stl
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: map2stl/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
