[pytest]
testpaths = tests ../numpy2stl/tests
# Exclude Playwright e2e tests from the default run.
# They require pytest-playwright + a live server and must be invoked explicitly:
#   pytest tests/e2e/ --browser chromium
# tests/manual/ holds scripts that need a live server; they are not collected.
norecursedirs = tests/e2e tests/manual
# The default run has no network: tests/conftest.py::_block_network makes outbound
# sockets raise unless the test is marked integration or requires_network.
# Integration tests (live network calls), slow tests (benchmarks, full sweeps) and
# ml tests (need torch) are opt-in:
#   pytest -m integration    |    pytest -m slow    |    pytest -m ml
addopts = --strict-markers -ra -m "not integration and not slow and not ml"
markers =
    integration: makes live network calls; excluded from the default run
    slow: takes more than a few seconds
    ml: needs torch (U-Net training / prediction); excluded from the default run
    requires_cache: needs the local disk cache (cache/ or MAP2STL_CACHE, gitignored); skipped when it is empty
    requires_gpu: needs a CUDA GPU; skipped without one
    requires_network: needs internet access (integration tests get it implicitly); skipped offline
    requires_keys: needs API keys (GOOGLE_MAPS_API_KEY, the OpenTopography key in config.json); skipped without
filterwarnings =
    # models/roof_shape_gbm.joblib was pickled with an older NumPy; joblib warns
    # once per array on load (about 500 warnings per run). Harmless.
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib
